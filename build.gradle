plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

group = 'com.aguilam.journeyrecruits'
version = '1.0.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.209'

    runs {
        client {
            client()
        }
    }

    mods {
        journeyrecruits {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
    compileOnly files('libs/journeymap-api-neoforge-1.21.1-2.0.0.jar')
}

